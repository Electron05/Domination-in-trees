services:
  app:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: cxx_domination_app
    environment:
      # Use spaces to separate values
      - TREE_SIZES=512 1024 2048 4096 8192
      - TREES_PER_BATCH=1000

      # Use spaces to separate values (in ascending order)
      - K_RAINBOW_VALUES=3 5 10
      
      - PREVIEWS_PER_VARIANT=2
      - PREVIEWS_SIZE=64

      # 1 = verify every solution after timing (not included in measured time), 0 = skip
      - CHECK_CORRECTNESS=1

      # Compares every solver against brute force search on ALL trees with 2..N vertices + hardcoded edge cases, 0 = skip
      - BRUTE_FORCE_MAX_SIZE=10

      - TZ=Europe/Warsaw
    volumes:
      - ./src:/app/src